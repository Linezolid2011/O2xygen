[project]
name = "o2xygen"
dynamic = ["version"]
description = "O2xygen - worldbuilding physics engine (Keplerian systems for fiction writers)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = "docs/version.txt" }   # single source of truth for the version

[tool.pytest.ini_options]
testpaths = ["tests"]
